# Tokens as Parameters formal-proof Bundle. The official dsh-base profile owns
# the Agent Loop, sessions, model adapters, filesystem, shell, compaction,
# token meter, sandbox and Web surface. These rows add only research-domain
# services and model-facing controls.
- insert:
    - id: tap-optimization
      name: '@tokens-as-parameters/core-optimization'

    - id: tap-relative-reflection
      name: '@tokens-as-parameters/optimizer-relative-reflection'

    - id: tap-proof-observer
      name: '@tokens-as-parameters/proof-observer'

    - id: tap-proof-agent
      name: '@tokens-as-parameters/proof-agent'

    - id: tap-prover-code-agent
      name: '@tokens-as-parameters/prover-code-agent'

    - id: tap-proof-loss
      name: '@tokens-as-parameters/proof-loss'

    - id: tap-loss-lean-dual
      name: '@tokens-as-parameters/loss-lean-dual'

    - id: tap-proof-verification
      name: '@tokens-as-parameters/proof-verification'

    - id: tap-verifier-lean
      name: '@tokens-as-parameters/verifier-lean'

    - id: tap-proof-runtime
      name: '@tokens-as-parameters/proof-runtime'
      config:
        benchmarkRoot: ./benchmarks
        preserveWorktrees: true

    - id: tap-proof-run-tools
      name: '@tokens-as-parameters/tool-proof-run'

    - id: tap-proof-run-ui
      name: '@tokens-as-parameters/ui-proof-run'
